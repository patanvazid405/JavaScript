<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
</head>
<style>
    .container{
        height: 700px;
        width: 800px;
        border: 2px solid black;
    }
</style>
<body>
    <button>Walking</button>
    <button>Coding</button>
    <button>GYM</button>
    <button>HomeWork</button> <br> <br>
    <div class="container"></div>

    <script>
        let but_el = document.querySelectorAll("button")
        let container_el = document.querySelector(".container")
        
        but_el.forEach(function(button){
            button.addEventListener("click", function(event){
                container_el.innerHTML += event.target.innerHTML + "<br>"
            })
        })
    </script>
</body>
</html>
