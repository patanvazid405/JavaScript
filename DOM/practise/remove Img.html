<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Image</title>

</head>
<body>
    <script>
        let image_el = document.createElement("img")
        image_el.src = "https://img.freepik.com/free-photo/courage-man-jump-through-gap-hill-business-concept-idea_1323-262.jpg?semt=ais_hybrid&w=740&q=80"
        document.body.appendChild(image_el)

        let but_el = document.createElement("button")
        but_el.innerHTML = "remove"
        document.body.append(but_el)
        but_el.addEventListener("click",function(){
            document.body.removeChild(image_el)

        })

        
    </script>
</body>
</html>
